name: Deploy SP-Manager Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          SP_BASE: /SP-Manager/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Check build output
        run: |
          test -f frontend/dist/index.html || { echo "frontend/dist/index.html is missing, the build produced no site."; exit 1; }

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  # Deploy runs as its own job after the upload has finished, as GitHub's Pages template does.
  # In the same job the "github-pages" artifact may not be listed yet ("No artifacts named github-pages were found").
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Hostinger: apps.shiningpearltinted.com is served from public_html/apps.
  # Runs only after the three HOSTINGER_FTP_* secrets are added in GitHub (Settings > Secrets and variables > Actions).
  hostinger:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}

    steps:
      - name: Checkout
        if: env.FTP_SERVER != ''
        uses: actions/checkout@v4

      - name: Setup Node
        if: env.FTP_SERVER != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        if: env.FTP_SERVER != ''
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build frontend for the domain root
        if: env.FTP_SERVER != ''
        working-directory: frontend
        run: npm run build
        env:
          SP_BASE: /

      - name: Add Apache settings
        if: env.FTP_SERVER != ''
        run: |
          cat > frontend/dist/.htaccess <<'HTACCESS'
          # SP-Manager on Hostinger (apps.shiningpearltinted.com)
          Options -Indexes
          DirectoryIndex index.html
          # Installable app (PWA) manifest
          AddType application/manifest+json .webmanifest

          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteCond %{HTTPS} !=on
            RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
          </IfModule>

          <IfModule mod_headers.c>
            # Security headers. No inline JavaScript is used (print windows are printed by the app),
            # so scripts are limited to this site. The API runs on *.shiningpearltinted.com.
            Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.shiningpearltinted.com http://127.0.0.1:18765 http://localhost:18765; worker-src 'self'; manifest-src 'self'; media-src 'self' data: blob:; frame-src 'self' blob: data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
            Header always set X-Frame-Options "DENY"
            Header always set X-Content-Type-Options "nosniff"
            Header always set Referrer-Policy "strict-origin-when-cross-origin"
            Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
            Header always set Strict-Transport-Security "max-age=31536000" "expr=%{HTTPS} == 'on'"
            # Pages and the service worker must always be fresh so a new upload is used at once.
            <FilesMatch "(^index\.html$|^sw\.js$|^manifest\.webmanifest$)">
              Header set Cache-Control "no-cache, no-store, must-revalidate"
            </FilesMatch>
            # Built files have a content hash in their name, so they can be cached for a year.
            <FilesMatch "\.(js|css)$">
              Header set Cache-Control "public, max-age=31536000, immutable"
            </FilesMatch>
            <FilesMatch "^sw\.js$">
              Header set Cache-Control "no-cache, no-store, must-revalidate"
            </FilesMatch>
          </IfModule>
          HTACCESS
          test -f frontend/dist/index.html

      - name: Upload to Hostinger
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          local-dir: frontend/dist/
          server-dir: ./
